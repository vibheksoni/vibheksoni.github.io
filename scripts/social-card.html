<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #121314; }
  #card {
    width: 1200px; height: 630px; display: flex; background: #121314; color: #d6d3ce;
    font-family: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  img { width: 440px; height: 630px; object-fit: cover; object-position: 50% 30%; display: block; }
  .text { flex: 1; padding: 0 72px 0 68px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 84px; line-height: 1.05; font-weight: 600; color: #eceae6; letter-spacing: -0.01em; }
  .role { margin-top: 18px; font-size: 32px; line-height: 1.35; color: #9b9893; }
  .about { margin-top: 40px; font-size: 30px; line-height: 1.45; }
  .about b { color: #eceae6; font-weight: 600; }
  .site { margin-top: 48px; font-size: 26px; color: #eceae6; text-decoration: underline; text-decoration-color: #6c6a66; text-underline-offset: 0.2em; }
</style>
</head>
<body>
<div id="card">
  <img src="../vibhek-soni-profile.jpg" alt="">
  <div class="text">
    <h1>Vibhek Soni</h1>
    <p class="role">Backend engineer in New York<br>AI infrastructure and security</p>
    <p class="about">I run <b>FreeTheAI</b> and maintain <b>Stealth Browser MCP</b>.</p>
    <p class="site">vibheksoni.com</p>
  </div>
</div>
</body>
</html>
