<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #121314; }
  #card {
    width: 1200px; height: 630px; display: flex; background: #121314; color: #d6d3ce;
    font-family: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  img { width: 400px; height: 630px; object-fit: cover; object-position: 50% 30%; display: block; }
  .text { flex: 1; padding: 64px 64px 56px 64px; display: flex; flex-direction: column; }
  h1 { font-size: 80px; line-height: 1; font-weight: 600; color: #eceae6; letter-spacing: -0.01em; }
  .role { margin-top: 20px; font-size: 30px; line-height: 1.3; color: #eceae6; white-space: nowrap; }
  .about { margin-top: 14px; font-size: 26px; line-height: 1.45; color: #9b9893; }
  .about b { color: #d6d3ce; font-weight: 600; }
  .links { margin-top: auto; padding-top: 28px; border-top: 1px solid #2b2c2e;
    display: grid; grid-template-columns: auto 1fr auto 1fr; column-gap: 18px; row-gap: 14px; font-size: 23px; line-height: 1.2; }
  .links dt { color: #9b9893; }
  .links dd { margin: 0; color: #eceae6; }
</style>
</head>
<body>
<div id="card">
  <img src="../vibhek-soni-profile.jpg" alt="">
  <div class="text">

    <p class="role">Backend engineer · AI infrastructure and security</p>
    <p class="about">Based in New York.<br>I run <b>FreeTheAI</b> and maintain <b>Stealth Browser MCP</b>.</p>
    <dl class="links">
      <dt>Site</dt><dd>vibheksoni.com</dd>
      <dt>Email</dt><dd>vibheksoni@engineer.com</dd>
      <dt>GitHub</dt><dd>vibheksoni</dd>
      <dt>LinkedIn</dt><dd>in/vibheksoni</dd>
      <dt>X</dt><dd>@ImVibhek</dd>
      <dt>YouTube</dt><dd>@vibheksoni</dd>
      <dt>Instagram</dt><dd>@nyc.vibhek</dd>
      <dt>Blog</dt><dd>opendoors.wtf</dd>
    </dl>
  </div>
</div>
</body>
</html>
